version: "3.9"

services:
  db:
    image: postgres:16
    container_name: go-orders-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PG2026!*
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_orders_table.sql:/docker-entrypoint-initdb.d/001_create_orders_table.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: go-orders-api
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: